[project]
name = "beltloop"
version = "0.1.0"
description = "A simple harness for me"
authors = [
    { name = "Matt", email = "matthew.restine@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
beltloop = "beltloop:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
